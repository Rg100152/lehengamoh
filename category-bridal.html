<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bridal Collection | Lehgamoh</title>
<meta name="description" content="Heirloom lehengas with intricate zari and hand embroidery for your big day.">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="icon" type="image/png" href="logo.png">
<script>
tailwind.config = { theme: { extend: {
  colors: { brand: '#800000', gold: '#D4AF37' },
  fontFamily: { serif: ['Playfair Display', 'serif'], sans: ['Poppins', 'sans-serif'] }
} } }
</script>
</head>
<body class="bg-gray-50 font-sans text-gray-800 flex flex-col min-h-screen">

<div id="navbar-placeholder"></div>

<main class="flex-1 w-full">
  <section class="relative h-64 md:h-72 flex items-center justify-center overflow-hidden bg-gray-900">
    <img src="images/13.jpeg" alt="Bridal Collection" class="absolute inset-0 w-full h-full object-cover opacity-45">
    <div class="absolute inset-0 bg-gradient-to-r from-black/70 to-black/30"></div>
    <div class="relative z-10 text-center text-white px-4" data-aos="fade-up">
      <p class="text-gold tracking-[0.3em] text-xs font-semibold uppercase mb-2">The Bridal Edit</p>
      <h1 class="text-4xl md:text-5xl font-serif font-bold">Bridal Collection</h1>
      <p class="text-white/80 text-sm mt-2 max-w-lg mx-auto">Heirloom lehengas with intricate zari and hand embroidery for your big day.</p>
    </div>
  </section>

  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
    <div class="flex flex-wrap items-center justify-between gap-3 mb-6">
      <p id="cat-count" class="text-sm text-gray-500"></p>
      <div class="flex items-center gap-2">
        <label class="text-xs text-gray-500 uppercase tracking-wider">Sort</label>
        <select id="sort" class="border border-gray-300 rounded-lg px-3 py-2 text-sm focus:border-brand">
          <option value="featured">Featured</option>
          <option value="price-asc">Price: Low to High</option>
          <option value="price-desc">Price: High to Low</option>
          <option value="rating">Top Rated</option>
          <option value="discount">Biggest Discount</option>
        </select>
      </div>
    </div>
    <div id="cat-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6"></div>
  </div>
</main>

<div id="footer-placeholder"></div>

<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
<script src="js/data.js"></script>
<script src="js/components.js"></script>
<script src="js/main.js"></script>
<script>

var CAT_LIST = products.filter(function (p) { return p.category === 'bridal'; });

function applyCategorySort() {
  var sort = document.getElementById('sort').value;
  var list = CAT_LIST.slice();
  if (sort === 'price-asc') list.sort(function (a, b) { return a.price - b.price; });
  else if (sort === 'price-desc') list.sort(function (a, b) { return b.price - a.price; });
  else if (sort === 'rating') list.sort(function (a, b) { return b.rating - a.rating; });
  else if (sort === 'discount') list.sort(function (a, b) { return b.discount - a.discount; });
  else list.sort(function (a, b) { return Number(b.featured) - Number(a.featured) || a.id - b.id; });
  document.getElementById('cat-count').textContent = list.length + ' products';
  renderProductGrid('cat-grid', list);
}

document.addEventListener('DOMContentLoaded', function () {
  document.getElementById('sort').addEventListener('change', applyCategorySort);
  applyCategorySort();
});

</script>
</body>
</html>
