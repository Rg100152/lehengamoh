<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order Confirmed | Lehgamoh</title>
<meta name="description" content="Your Lehgamoh order has been placed successfully.">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="icon" type="image/png" href="logo.png">
<script>
tailwind.config = { theme: { extend: {
  colors: { brand: '#800000', gold: '#D4AF37' },
  fontFamily: { serif: ['Playfair Display', 'serif'], sans: ['Poppins', 'sans-serif'] }
} } }
</script>
</head>
<body class="bg-gray-50 font-sans text-gray-800 flex flex-col min-h-screen">

<div id="navbar-placeholder"></div>

<main class="flex-1 flex items-center justify-center px-4 py-16 w-full">
  <div class="bg-white rounded-2xl shadow-lg p-8 md:p-12 max-w-xl w-full text-center">
    <div class="w-20 h-20 bg-emerald-50 rounded-full flex items-center justify-center mx-auto mb-6">
      <i class="fa-solid fa-check text-3xl text-emerald-600"></i>
    </div>
    <h1 class="text-3xl font-serif text-gray-900 mb-2">Thank You for Your Order!</h1>
    <p class="text-gray-500 mb-6">Your Lehgamoh order has been placed successfully.</p>

    <div id="order-box" class="bg-gray-50 rounded-xl p-5 text-left mb-6 hidden">
      <div class="flex justify-between text-sm mb-2"><span class="text-gray-500">Order ID</span><span id="ty-id" class="font-semibold"></span></div>
      <div class="flex justify-between text-sm mb-2"><span class="text-gray-500">Date</span><span id="ty-date" class="font-semibold"></span></div>
      <div class="flex justify-between text-sm mb-2"><span class="text-gray-500">Payment</span><span id="ty-payment" class="font-semibold"></span></div>
      <div class="flex justify-between text-sm"><span class="text-gray-500">Total</span><span id="ty-total" class="font-bold text-brand"></span></div>
    </div>

    <p class="text-sm text-gray-500 mb-6">A confirmation has been sent to your email. You can track your order from your account.</p>

    <div class="flex flex-col sm:flex-row gap-3 justify-center">
      <a href="orders.html" class="bg-brand text-white px-6 py-3 rounded-lg font-semibold hover:bg-[#5a0000]">My Orders</a>
      <a href="track-order.html" class="border border-gray-300 text-gray-700 px-6 py-3 rounded-lg font-semibold hover:border-brand hover:text-brand">Track Order</a>
      <a href="shop.html" class="border border-gray-300 text-gray-700 px-6 py-3 rounded-lg font-semibold hover:border-brand hover:text-brand">Continue Shopping</a>
    </div>
  </div>
</main>

<div id="footer-placeholder"></div>

<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
<script src="js/data.js"></script>
<script src="js/components.js"></script>
<script src="js/main.js"></script>
<script>

document.addEventListener('DOMContentLoaded', function () {
  var id = new URLSearchParams(window.location.search).get('order');
  if (!id) return;
  var orders = readJSON(LGH.orders, []);
  var order = orders.find(function (o) { return o.id === id; });
  if (!order) return;
  document.getElementById('order-box').classList.remove('hidden');
  document.getElementById('ty-id').textContent = order.id;
  document.getElementById('ty-date').textContent = order.date;
  document.getElementById('ty-payment').textContent = order.payment;
  document.getElementById('ty-total').textContent = formatPrice(order.total);
});

</script>
</body>
</html>
