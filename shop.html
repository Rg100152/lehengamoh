<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shop | Lehgamoh</title>
<meta name="description" content="Shop the complete Lehgamoh collection of bridal lehengas, wedding gowns, sarees and party wear.">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="icon" type="image/png" href="logo.png">
<script>
tailwind.config = { theme: { extend: {
  colors: { brand: '#800000', gold: '#D4AF37' },
  fontFamily: { serif: ['Playfair Display', 'serif'], sans: ['Poppins', 'sans-serif'] }
} } }
</script>
</head>
<body class="bg-gray-50 font-sans text-gray-800 flex flex-col min-h-screen">

<div id="navbar-placeholder"></div>

<main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10 flex-1 w-full">
  <div class="mb-8">
    <p class="text-xs text-gray-400 mb-2"><a href="index.html" class="hover:text-brand">Home</a> / Shop</p>
    <h1 class="text-3xl md:text-4xl font-serif text-gray-900">Our Collection</h1>
    <p class="text-gray-500 mt-2 text-sm">44 handcrafted pieces, made for celebrations big and small.</p>
  </div>

  <div class="grid grid-cols-1 lg:grid-cols-4 gap-8">
    <aside class="lg:col-span-1">
      <div class="bg-white rounded-xl shadow-sm p-6 sticky top-28">
        <div class="flex items-center justify-between mb-5">
          <h2 class="font-semibold text-gray-900 flex items-center gap-2"><i class="fa-solid fa-sliders text-brand"></i> Filters</h2>
          <button id="clear-filters" class="text-xs text-brand hover:underline">Clear all</button>
        </div>

        <div class="mb-6">
          <label class="block text-xs font-semibold uppercase tracking-wider text-gray-500 mb-2">Search</label>
          <input id="shop-search" type="text" placeholder="Search products..." class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:border-brand">
        </div>

        <form id="filters">
          <div class="mb-6">
            <p class="text-xs font-semibold uppercase tracking-wider text-gray-500 mb-3">Category</p>
            <label class="flex items-center gap-2 text-sm text-gray-700 mb-2 cursor-pointer"><input type="checkbox" name="category" value="bridal" class="accent-brand"> Bridal</label>
            <label class="flex items-center gap-2 text-sm text-gray-700 mb-2 cursor-pointer"><input type="checkbox" name="category" value="wedding" class="accent-brand"> Wedding</label>
            <label class="flex items-center gap-2 text-sm text-gray-700 mb-2 cursor-pointer"><input type="checkbox" name="category" value="party" class="accent-brand"> Party Wear</label>
            <label class="flex items-center gap-2 text-sm text-gray-700 mb-2 cursor-pointer"><input type="checkbox" name="category" value="reception" class="accent-brand"> Reception</label>
            <label class="flex items-center gap-2 text-sm text-gray-700 mb-2 cursor-pointer"><input type="checkbox" name="category" value="casual" class="accent-brand"> Casual &amp; Suits</label>
          </div>

          <div class="mb-6">
            <p class="text-xs font-semibold uppercase tracking-wider text-gray-500 mb-3">Price</p>
            <label class="flex items-center gap-2 text-sm text-gray-700 mb-2 cursor-pointer"><input type="radio" name="price" value="all" checked class="accent-brand"> All prices</label>
            <label class="flex items-center gap-2 text-sm text-gray-700 mb-2 cursor-pointer"><input type="radio" name="price" value="0-10000" class="accent-brand"> Under ₹10,000</label>
            <label class="flex items-center gap-2 text-sm text-gray-700 mb-2 cursor-pointer"><input type="radio" name="price" value="10000-15000" class="accent-brand"> ₹10,000 – ₹15,000</label>
            <label class="flex items-center gap-2 text-sm text-gray-700 mb-2 cursor-pointer"><input type="radio" name="price" value="15000-20000" class="accent-brand"> ₹15,000 – ₹20,000</label>
            <label class="flex items-center gap-2 text-sm text-gray-700 mb-2 cursor-pointer"><input type="radio" name="price" value="20000-999999" class="accent-brand"> Above ₹20,000</label>
          </div>

          <div>
            <label class="block text-xs font-semibold uppercase tracking-wider text-gray-500 mb-2">Sort by</label>
            <select name="sort" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:border-brand">
              <option value="featured">Featured</option>
              <option value="price-asc">Price: Low to High</option>
              <option value="price-desc">Price: High to Low</option>
              <option value="rating">Top Rated</option>
              <option value="discount">Biggest Discount</option>
              <option value="newest">Newest First</option>
            </select>
          </div>
        </form>
      </div>
    </aside>

    <section class="lg:col-span-3">
      <p id="result-count" class="text-sm text-gray-500 mb-4"></p>
      <div id="shop-grid" class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-6"></div>
    </section>
  </div>
</main>

<div id="footer-placeholder"></div>

<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
<script src="js/data.js"></script>
<script src="js/components.js"></script>
<script src="js/main.js"></script>
<script>

(function () {
  var params = new URLSearchParams(window.location.search);
  var initialQ = params.get('q') || '';
  var initialCat = params.get('category') || '';

  function applyFilters() {
    var searchInput = document.getElementById('shop-search');
    var filters = document.getElementById('filters');
    var q = (searchInput.value || '').toLowerCase().trim();

    var cats = Array.prototype.slice
      .call(filters.querySelectorAll('input[name="category"]:checked'))
      .map(function (el) { return el.value; });

    var priceEl = filters.querySelector('input[name="price"]:checked');
    var range = priceEl ? priceEl.value : 'all';
    var sort = filters.querySelector('select[name="sort"]').value;

    var list = products.filter(function (p) {
      var matchQ = !q || p.name.toLowerCase().indexOf(q) !== -1 || p.categoryLabel.toLowerCase().indexOf(q) !== -1;
      var matchCat = !cats.length || cats.indexOf(p.category) !== -1;
      var matchPrice = true;
      if (range !== 'all') {
        var parts = range.split('-');
        matchPrice = p.price >= Number(parts[0]) && p.price <= Number(parts[1]);
      }
      return matchQ && matchCat && matchPrice;
    });

    if (sort === 'price-asc') list.sort(function (a, b) { return a.price - b.price; });
    else if (sort === 'price-desc') list.sort(function (a, b) { return b.price - a.price; });
    else if (sort === 'rating') list.sort(function (a, b) { return b.rating - a.rating; });
    else if (sort === 'discount') list.sort(function (a, b) { return b.discount - a.discount; });
    else if (sort === 'newest') list.sort(function (a, b) { return b.id - a.id; });
    else list.sort(function (a, b) { return Number(b.featured) - Number(a.featured) || a.id - b.id; });

    document.getElementById('result-count').textContent = 'Showing ' + list.length + ' of ' + products.length + ' products';
    renderProductGrid('shop-grid', list);
  }

  document.addEventListener('DOMContentLoaded', function () {
    var searchInput = document.getElementById('shop-search');
    if (initialQ) searchInput.value = initialQ;

    if (initialCat) {
      var cb = document.querySelector('input[name="category"][value="' + initialCat + '"]');
      if (cb) cb.checked = true;
    }

    searchInput.addEventListener('input', applyFilters);
    document.getElementById('filters').addEventListener('change', applyFilters);
    document.getElementById('clear-filters').addEventListener('click', function () {
      document.getElementById('filters').reset();
      searchInput.value = '';
      applyFilters();
    });

    applyFilters();
  });
})();

</script>
</body>
</html>
