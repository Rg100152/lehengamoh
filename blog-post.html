<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Journal Article | Lehgamoh</title>
<meta name="description" content="Read the latest styling and craft story from the Lehgamoh Journal.">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="icon" type="image/png" href="logo.png">
<script>
tailwind.config = { theme: { extend: {
  colors: { brand: '#800000', gold: '#D4AF37' },
  fontFamily: { serif: ['Playfair Display', 'serif'], sans: ['Poppins', 'sans-serif'] }
} } }
</script>
</head>
<body class="bg-gray-50 font-sans text-gray-800 flex flex-col min-h-screen">

<div id="navbar-placeholder"></div>

<main class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 py-12 flex-1 w-full">
  <nav class="text-xs text-gray-400 mb-6"><a href="index.html" class="hover:text-brand">Home</a> / <a href="blog.html" class="hover:text-brand">Journal</a> / <span id="bp-crumb">Article</span></nav>
  <div id="blog-post"></div>
  <section id="bp-related" class="mt-16 hidden">
    <h2 class="text-2xl font-serif text-gray-900 mb-6">More from the Journal</h2>
    <div id="bp-related-grid" class="grid grid-cols-1 sm:grid-cols-2 gap-5"></div>
  </section>
</main>

<div id="footer-placeholder"></div>

<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
<script src="js/data.js"></script>
<script src="js/components.js"></script>
<script src="js/main.js"></script>
<script>

document.addEventListener('DOMContentLoaded', function () {
  var id = Number(new URLSearchParams(window.location.search).get('id'));
  var blog = blogs.find(function (b) { return b.id === id; });
  var wrap = document.getElementById('blog-post');

  if (!blog) {
    wrap.innerHTML = '<div class="bg-white rounded-xl shadow-sm p-12 text-center"><h1 class="text-2xl font-serif mb-3">Article Not Found</h1><p class="text-gray-500 mb-6">The article you are looking for does not exist.</p><a href="blog.html" class="inline-block bg-brand text-white px-7 py-3 rounded-lg font-semibold hover:bg-[#5a0000]">Back to Journal</a></div>';
    return;
  }

  document.title = blog.title + ' | Lehgamoh Journal';
  document.getElementById('bp-crumb').textContent = blog.title;

  var sentences = blog.content.match(/[^.!?]+[.!?]+/g) || [blog.content];
  var paragraphs = [];
  for (var i = 0; i < sentences.length; i += 2) {
    paragraphs.push(sentences.slice(i, i + 2).join(' ').trim());
  }

  wrap.innerHTML =
    '<article class="bg-white rounded-2xl shadow-sm overflow-hidden">' +
    '<img src="' + blog.image + '" alt="' + escapeHtml(blog.title) + '" class="w-full h-72 object-cover" onerror="this.src=\'https://via.placeholder.com/800x400\'">' +
    '<div class="p-6 md:p-10">' +
    '<p class="text-xs text-gray-400 mb-3">' + blog.date + ' • ' + escapeHtml(blog.author) + '</p>' +
    '<h1 class="text-3xl md:text-4xl font-serif text-gray-900 mb-5">' + escapeHtml(blog.title) + '</h1>' +
    '<p class="text-gray-600 leading-relaxed text-lg mb-6 border-l-4 border-gold pl-4 italic">' + escapeHtml(blog.excerpt) + '</p>' +
    paragraphs.map(function (p) { return '<p class="text-gray-600 leading-relaxed mb-4">' + escapeHtml(p) + '</p>'; }).join('') +
    '<a href="blog.html" class="inline-block mt-4 text-brand font-semibold hover:underline"><i class="fa-solid fa-arrow-left mr-1"></i>Back to Journal</a>' +
    '</div></article>';

  var related = blogs.filter(function (b) { return b.id !== blog.id; }).slice(0, 2);
  if (related.length) {
    document.getElementById('bp-related').classList.remove('hidden');
    document.getElementById('bp-related-grid').innerHTML = related.map(function (b) {
      return '<a href="blog-post.html?id=' + b.id + '" class="bg-white rounded-xl shadow-sm overflow-hidden card-hover block">' +
        '<img src="' + b.image + '" alt="' + escapeHtml(b.title) + '" class="w-full h-40 object-cover">' +
        '<div class="p-4"><p class="text-xs text-gray-400 mb-1">' + b.date + '</p><h3 class="font-serif font-semibold hover:text-brand">' + escapeHtml(b.title) + '</h3></div></a>';
    }).join('');
  }
  if (window.AOS) AOS.refresh();
});

</script>
</body>
</html>
