<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Orders | Lehgamoh</title>
<meta name="description" content="View your complete Lehgamoh order history.">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="icon" type="image/png" href="logo.png">
<script>
tailwind.config = { theme: { extend: {
  colors: { brand: '#800000', gold: '#D4AF37' },
  fontFamily: { serif: ['Playfair Display', 'serif'], sans: ['Poppins', 'sans-serif'] }
} } }
</script>
</head>
<body class="bg-gray-50 font-sans text-gray-800 flex flex-col min-h-screen">

<div id="navbar-placeholder"></div>

<main class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-10 flex-1 w-full">
  <div class="mb-8">
    <p class="text-xs text-gray-400 mb-2"><a href="account.html" class="hover:text-brand">My Account</a> / Orders</p>
    <h1 class="text-3xl md:text-4xl font-serif text-gray-900">My Orders</h1>
  </div>
  <div id="orders-wrap"></div>
</main>

<div id="footer-placeholder"></div>

<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
<script src="js/data.js"></script>
<script src="js/components.js"></script>
<script src="js/main.js"></script>
<script>

function statusColor(status) {
  if (status === 'Delivered') return 'bg-emerald-100 text-emerald-700';
  if (status === 'Dispatched') return 'bg-blue-100 text-blue-700';
  if (status === 'Cancelled') return 'bg-red-100 text-red-700';
  return 'bg-amber-100 text-amber-700';
}

function renderOrders() {
  var wrap = document.getElementById('orders-wrap');
  var orders = readJSON(LGH.orders, []);

  if (!orders.length) {
    wrap.innerHTML =
      '<div class="bg-white rounded-xl shadow-sm p-16 text-center">' +
      '<i class="fa-solid fa-box-open text-5xl text-gray-300 mb-4"></i>' +
      '<p class="text-gray-500 text-lg mb-1">You have not placed any orders yet.</p>' +
      '<p class="text-gray-400 text-sm mb-6">Your order history will appear here once you shop with us.</p>' +
      '<a href="shop.html" class="inline-block bg-brand text-white px-8 py-3 rounded-lg font-semibold hover:bg-[#5a0000]">Start Shopping</a>' +
      '</div>';
    return;
  }

  wrap.innerHTML = orders.map(function (order) {
    var thumbs = order.items.slice(0, 4).map(function (item) {
      return '<img src="' + item.image + '" alt="' + escapeHtml(item.name) + '" class="w-12 h-16 object-cover rounded" onerror="this.src=\'https://via.placeholder.com/60x80\'">';
    }).join('');
    var more = order.items.length > 4 ? '<span class="text-xs text-gray-400">+' + (order.items.length - 4) + ' more</span>' : '';
    return '<div class="bg-white rounded-xl shadow-sm p-5 md:p-6 mb-4">' +
      '<div class="flex flex-wrap items-center justify-between gap-3 pb-4 border-b">' +
      '<div><p class="font-semibold text-gray-900">' + order.id + '</p><p class="text-xs text-gray-500">Placed on ' + order.date + '</p></div>' +
      '<span class="text-xs font-semibold px-3 py-1 rounded-full ' + statusColor(order.status) + '">' + order.status + '</span>' +
      '</div>' +
      '<div class="flex items-center gap-3 py-4">' + thumbs + more + '</div>' +
      '<div class="flex flex-wrap items-center justify-between gap-3">' +
      '<p class="text-sm text-gray-500">' + order.items.length + ' item(s) • <span class="font-bold text-brand">' + formatPrice(order.total) + '</span></p>' +
      '<div class="flex gap-2">' +
      '<button onclick="reorder(\'' + order.id + '\')" class="border border-gray-300 text-gray-700 px-4 py-2 rounded-lg text-sm hover:border-brand hover:text-brand"><i class="fa-solid fa-rotate-right mr-1"></i>Reorder</button>' +
      '<a href="order-details.html?id=' + order.id + '" class="bg-brand text-white px-4 py-2 rounded-lg text-sm hover:bg-[#5a0000]">View Details</a>' +
      '</div></div></div>';
  }).join('');
}

function reorder(id) {
  var order = readJSON(LGH.orders, []).find(function (o) { return o.id === id; });
  if (!order) return;
  var cart = getCart();
  order.items.forEach(function (item) {
    var existing = cart.find(function (c) { return c.id === item.id && c.size === item.size; });
    if (existing) existing.quantity += item.quantity;
    else cart.push({ id: item.id, name: item.name, image: item.image, price: item.price, size: item.size, quantity: item.quantity });
  });
  saveCart(cart);
  toast('Items from ' + id + ' added to your bag', 'success');
  openCartDrawer();
}

(function () {
  if (!getUser()) {
    window.location.href = 'login.html?redirect=orders.html';
    return;
  }
  document.addEventListener('DOMContentLoaded', renderOrders);
})();

</script>
</body>
</html>
