<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | Lehgamoh</title>
<meta name="description" content="Login to your Lehgamoh account to manage orders, wishlist and addresses.">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="icon" type="image/png" href="logo.png">
<script>
tailwind.config = { theme: { extend: {
  colors: { brand: '#800000', gold: '#D4AF37' },
  fontFamily: { serif: ['Playfair Display', 'serif'], sans: ['Poppins', 'sans-serif'] }
} } }
</script>
</head>
<body class="bg-gray-50 font-sans text-gray-800 flex flex-col min-h-screen">

<div id="navbar-placeholder"></div>

<main class="flex-1 flex items-center justify-center py-16 px-4 w-full">
  <div class="bg-white p-8 md:p-10 rounded-2xl shadow-xl w-full max-w-md">
    <div class="text-center mb-8">
      <img src="logo.png" alt="Lehgamoh" class="h-14 w-14 object-contain mx-auto mb-3" onerror="this.style.display='none'">
      <h1 class="text-3xl font-serif font-bold text-brand">Welcome Back</h1>
      <p class="text-gray-500 text-sm mt-2">Login to your Lehgamoh account</p>
    </div>

    <div id="logged-box" class="hidden text-center">
      <div class="w-16 h-16 rounded-full bg-brand/10 text-brand flex items-center justify-center text-2xl font-bold mx-auto mb-4" id="logged-initial">L</div>
      <p class="text-gray-600 mb-1">You are logged in as</p>
      <p id="logged-name" class="text-xl font-serif font-bold text-brand mb-6"></p>
      <a href="account.html" class="block w-full bg-brand text-white py-3 rounded-lg font-semibold hover:bg-[#5a0000] mb-2">Go to My Account</a>
      <button onclick="logout()" class="w-full border border-gray-300 text-gray-700 py-3 rounded-lg font-semibold hover:border-brand hover:text-brand">Logout</button>
    </div>

    <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Email Address</label>
        <input id="login-email" type="email" required placeholder="you@example.com" class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:border-brand">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
        <input id="login-password" type="password" required placeholder="Enter your password" class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:border-brand">
      </div>
      <div class="flex justify-between items-center text-sm">
        <label class="flex items-center gap-2 text-gray-600"><input type="checkbox" class="accent-brand"> Remember me</label>
        <a href="forgot-password.html" class="text-brand hover:underline">Forgot password?</a>
      </div>
      <button type="submit" class="w-full bg-brand text-white py-3 rounded-lg font-semibold hover:bg-[#5a0000] transition">Login</button>
    </form>

    <p class="text-center text-sm text-gray-500 mt-6">New to Lehgamoh? <a href="signup.html" class="text-brand font-semibold hover:underline">Create an account</a></p>
  </div>
</main>

<div id="footer-placeholder"></div>

<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
<script src="js/data.js"></script>
<script src="js/components.js"></script>
<script src="js/main.js"></script>
<script>

function handleLogin(event) {
  event.preventDefault();
  var email = document.getElementById('login-email').value.trim().toLowerCase();
  var password = document.getElementById('login-password').value;
  var accounts = readJSON(LGH.accounts, []);
  var account = accounts.find(function (a) { return a.email === email; });
  var name;

  if (account) {
    if (account.pass !== btoa(password)) {
      toast('Incorrect password. Please try again.', 'error');
      return;
    }
    name = account.name;
  } else {
    name = email.split('@')[0].replace(/[._-]/g, ' ').replace(/\b\w/g, function (c) { return c.toUpperCase(); });
  }

  setUser({ name: name, email: email });
  toast('Welcome back, ' + name + '!', 'success');
  var redirect = new URLSearchParams(window.location.search).get('redirect') || 'account.html';
  setTimeout(function () { window.location.href = redirect; }, 500);
}

document.addEventListener('DOMContentLoaded', function () {
  var user = getUser();
  if (user) {
    document.getElementById('login-form').classList.add('hidden');
    document.getElementById('logged-box').classList.remove('hidden');
    document.getElementById('logged-name').textContent = user.name + ' (' + (user.email || '') + ')';
    document.getElementById('logged-initial').textContent = (user.name || 'L').charAt(0).toUpperCase();
  }
});

</script>
</body>
</html>
