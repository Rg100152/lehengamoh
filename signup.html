<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account | Lehgamoh</title>
<meta name="description" content="Create your Lehgamoh account for a faster, more personal shopping experience.">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="icon" type="image/png" href="logo.png">
<script>
tailwind.config = { theme: { extend: {
  colors: { brand: '#800000', gold: '#D4AF37' },
  fontFamily: { serif: ['Playfair Display', 'serif'], sans: ['Poppins', 'sans-serif'] }
} } }
</script>
</head>
<body class="bg-gray-50 font-sans text-gray-800 flex flex-col min-h-screen">

<div id="navbar-placeholder"></div>

<main class="flex-1 flex items-center justify-center py-16 px-4 w-full">
  <div class="bg-white p-8 md:p-10 rounded-2xl shadow-xl w-full max-w-md">
    <div class="text-center mb-8">
      <img src="logo.png" alt="Lehgamoh" class="h-14 w-14 object-contain mx-auto mb-3" onerror="this.style.display='none'">
      <h1 class="text-3xl font-serif font-bold text-brand">Create Account</h1>
      <p class="text-gray-500 text-sm mt-2">Join the Lehgamoh family</p>
    </div>

    <form id="signup-form" onsubmit="handleSignup(event)" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Full Name</label>
        <input id="su-name" type="text" required placeholder="Your full name" class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:border-brand">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Email Address</label>
        <input id="su-email" type="email" required placeholder="you@example.com" class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:border-brand">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
        <input id="su-password" type="password" required minlength="6" placeholder="Minimum 6 characters" class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:border-brand">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Confirm Password</label>
        <input id="su-confirm" type="password" required placeholder="Re-enter password" class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:border-brand">
      </div>
      <label class="flex items-start gap-2 text-xs text-gray-500"><input type="checkbox" required class="accent-brand mt-0.5"> I agree to the <a href="terms-conditions.html" class="text-brand hover:underline">Terms</a> and <a href="privacy-policy.html" class="text-brand hover:underline">Privacy Policy</a>.</label>
      <button type="submit" class="w-full bg-brand text-white py-3 rounded-lg font-semibold hover:bg-[#5a0000] transition">Create Account</button>
    </form>

    <p class="text-center text-sm text-gray-500 mt-6">Already have an account? <a href="login.html" class="text-brand font-semibold hover:underline">Login</a></p>
  </div>
</main>

<div id="footer-placeholder"></div>

<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
<script src="js/data.js"></script>
<script src="js/components.js"></script>
<script src="js/main.js"></script>
<script>

function handleSignup(event) {
  event.preventDefault();
  var name = document.getElementById('su-name').value.trim();
  var email = document.getElementById('su-email').value.trim().toLowerCase();
  var password = document.getElementById('su-password').value;
  var confirm = document.getElementById('su-confirm').value;

  if (password.length < 6) {
    toast('Password must be at least 6 characters', 'error');
    return;
  }
  if (password !== confirm) {
    toast('Passwords do not match', 'error');
    return;
  }

  var accounts = readJSON(LGH.accounts, []);
  if (accounts.some(function (a) { return a.email === email; })) {
    toast('An account with this email already exists', 'error');
    return;
  }

  accounts.push({ name: name, email: email, pass: btoa(password) });
  writeJSON(LGH.accounts, accounts);
  setUser({ name: name, email: email });
  toast('Account created. Welcome to Lehgamoh!', 'success');
  setTimeout(function () { window.location.href = 'account.html'; }, 600);
}

</script>
</body>
</html>
