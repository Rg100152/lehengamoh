<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment Methods | Lehgamoh</title>
<meta name="description" content="Manage your saved payment methods at Lehgamoh.">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="icon" type="image/png" href="logo.png">
<script>
tailwind.config = { theme: { extend: {
  colors: { brand: '#800000', gold: '#D4AF37' },
  fontFamily: { serif: ['Playfair Display', 'serif'], sans: ['Poppins', 'sans-serif'] }
} } }
</script>
</head>
<body class="bg-gray-50 font-sans text-gray-800 flex flex-col min-h-screen">

<div id="navbar-placeholder"></div>

<main class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-10 flex-1 w-full">
  <div class="mb-8">
    <p class="text-xs text-gray-400 mb-2"><a href="account.html" class="hover:text-brand">My Account</a> / Payment Methods</p>
    <h1 class="text-3xl md:text-4xl font-serif text-gray-900">Payment Methods</h1>
  </div>

  <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
    <div>
      <div id="card-list" class="space-y-4"></div>
      <div class="mt-4 bg-amber-50 border border-amber-200 text-amber-700 text-xs rounded-lg p-4"><i class="fa-solid fa-circle-info mr-1"></i> This is a demo. Only the last four digits are stored locally; no real card data is processed.</div>
    </div>
    <div class="bg-white rounded-xl shadow-sm p-6 h-fit">
      <h2 class="text-lg font-serif font-bold mb-4">Add a Card</h2>
      <form id="card-form" onsubmit="saveCard(event)" class="space-y-3">
        <input id="card-name" required type="text" placeholder="Name on card" class="w-full border border-gray-300 rounded-lg px-4 py-2.5 text-sm focus:border-brand">
        <input id="card-number" required type="text" maxlength="19" placeholder="Card number (16 digits)" class="w-full border border-gray-300 rounded-lg px-4 py-2.5 text-sm focus:border-brand">
        <div class="grid grid-cols-2 gap-3">
          <input id="card-expiry" required type="text" maxlength="5" placeholder="MM/YY" class="w-full border border-gray-300 rounded-lg px-4 py-2.5 text-sm focus:border-brand">
          <input id="card-cvv" required type="password" maxlength="3" placeholder="CVV" class="w-full border border-gray-300 rounded-lg px-4 py-2.5 text-sm focus:border-brand">
        </div>
        <button type="submit" class="w-full bg-brand text-white py-3 rounded-lg text-sm font-semibold hover:bg-[#5a0000]">Save Card</button>
      </form>
    </div>
  </div>
</main>

<div id="footer-placeholder"></div>

<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
<script src="js/data.js"></script>
<script src="js/components.js"></script>
<script src="js/main.js"></script>
<script>

function renderCards() {
  var list = readJSON(LGH.cards, []);
  var wrap = document.getElementById('card-list');

  if (!list.length) {
    wrap.innerHTML = '<div class="bg-white rounded-xl shadow-sm p-10 text-center"><i class="fa-regular fa-credit-card text-4xl text-gray-300 mb-3"></i><p class="text-gray-500 text-sm">No saved cards yet.</p></div>';
    return;
  }

  wrap.innerHTML = list.map(function (c) {
    return '<div class="bg-gradient-to-br from-gray-900 to-gray-700 text-white rounded-xl p-5 shadow">' +
      '<div class="flex justify-between items-start"><i class="fa-solid fa-microchip text-2xl text-gold"></i><button onclick="deleteCard(' + c.id + ')" class="text-gray-400 hover:text-red-400" aria-label="Delete"><i class="fa-solid fa-trash"></i></button></div>' +
      '<p class="tracking-[0.2em] text-lg mt-6">•••• •••• •••• ' + c.last4 + '</p>' +
      '<div class="flex justify-between mt-4 text-xs text-gray-300"><span>' + escapeHtml(c.name) + '</span><span>' + escapeHtml(c.expiry) + '</span></div>' +
      '</div>';
  }).join('');
}

function saveCard(event) {
  event.preventDefault();
  var number = document.getElementById('card-number').value.replace(/\s/g, '');
  var expiry = document.getElementById('card-expiry').value.trim();
  var cvv = document.getElementById('card-cvv').value.trim();

  if (!/^[0-9]{16}$/.test(number)) { toast('Enter a valid 16-digit card number', 'error'); return; }
  if (!/^(0[1-9]|1[0-2])\/[0-9]{2}$/.test(expiry)) { toast('Expiry must be in MM/YY format', 'error'); return; }
  if (!/^[0-9]{3}$/.test(cvv)) { toast('Enter a valid 3-digit CVV', 'error'); return; }

  var list = readJSON(LGH.cards, []);
  list.push({
    id: Date.now(),
    name: document.getElementById('card-name').value.trim(),
    last4: number.slice(-4),
    expiry: expiry
  });
  writeJSON(LGH.cards, list);
  event.target.reset();
  toast('Card saved (demo)', 'success');
  renderCards();
}

function deleteCard(id) {
  var list = readJSON(LGH.cards, []).filter(function (c) { return c.id !== id; });
  writeJSON(LGH.cards, list);
  renderCards();
  toast('Card removed', 'info');
}

(function () {
  if (!getUser()) {
    window.location.href = 'login.html?redirect=payment-methods.html';
    return;
  }
  document.addEventListener('DOMContentLoaded', renderCards);
})();

</script>
</body>
</html>
