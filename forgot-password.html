<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password | Lehgamoh</title>
<meta name="description" content="Reset your Lehgamoh account password.">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="icon" type="image/png" href="logo.png">
<script>
tailwind.config = { theme: { extend: {
  colors: { brand: '#800000', gold: '#D4AF37' },
  fontFamily: { serif: ['Playfair Display', 'serif'], sans: ['Poppins', 'sans-serif'] }
} } }
</script>
</head>
<body class="bg-gray-50 font-sans text-gray-800 flex flex-col min-h-screen">

<div id="navbar-placeholder"></div>

<main class="flex-1 flex items-center justify-center py-16 px-4 w-full">
  <div class="bg-white p-8 md:p-10 rounded-2xl shadow-xl w-full max-w-md">
    <div class="text-center mb-8">
      <div class="w-16 h-16 rounded-full bg-brand/10 text-brand flex items-center justify-center text-2xl mx-auto mb-4"><i class="fa-solid fa-key"></i></div>
      <h1 class="text-3xl font-serif font-bold text-brand">Forgot Password?</h1>
      <p class="text-gray-500 text-sm mt-2">Enter your registered email and we will send you a reset link.</p>
    </div>

    <form id="forgot-form" onsubmit="sendReset(event)" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Email Address</label>
        <input id="fp-email" type="email" required placeholder="you@example.com" class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:border-brand">
      </div>
      <button type="submit" class="w-full bg-brand text-white py-3 rounded-lg font-semibold hover:bg-[#5a0000] transition">Send Reset Link</button>
    </form>

    <div id="fp-success" class="hidden mt-6 bg-emerald-50 border border-emerald-200 text-emerald-700 text-sm rounded-lg p-4">
      <i class="fa-solid fa-circle-check mr-1"></i> If an account exists for that email, a reset link has been sent. (Demo only — no email is actually sent.)
    </div>

    <p class="text-center text-sm text-gray-500 mt-6"><a href="login.html" class="text-brand font-semibold hover:underline"><i class="fa-solid fa-arrow-left mr-1"></i>Back to Login</a></p>
  </div>
</main>

<div id="footer-placeholder"></div>

<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
<script src="js/data.js"></script>
<script src="js/components.js"></script>
<script src="js/main.js"></script>
<script>

function sendReset(event) {
  event.preventDefault();
  document.getElementById('fp-success').classList.remove('hidden');
  toast('Reset link sent (demo)', 'success');
  event.target.reset();
}

</script>
</body>
</html>
